<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phishing Scan</title>
    <style>
      body {
        font-family: Segoe UI, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        background: #0f172a;
        color: #e2e8f0;
      }
      label {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #1e293b;
        color: #e2e8f0;
      }
      button {
        width: 100%;
        background: #38bdf8;
        color: #082f49;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 6px;
      }
      button.secondary {
        background: #334155;
        color: #e2e8f0;
      }
      .card {
        margin-top: 10px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        font-size: 13px;
      }
      .danger { color: #f87171; }
      .warn { color: #fbbf24; }
      .safe { color: #34d399; }
      .offline { color: #fbbf24; }
      .hint { font-size: 11px; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <label for="apiBase">Backend API URL</label>
    <input id="apiBase" type="url" placeholder="http://127.0.0.1:8000" />
    <button id="saveApiBtn" class="secondary" type="button">Save API URL</button>
    <button id="testApiBtn" class="secondary" type="button">Test backend connection</button>
    <button id="scanBtn" type="button">Scan this tab</button>
    <div id="result" class="card">Webmail: badge auto-scans open email. Other sites: use Scan this tab.</div>
    <p class="hint">Start: uvicorn main:app --host 127.0.0.1 --port 8000</p>
    <script src="popup.js"></script>
  </body>
</html>
